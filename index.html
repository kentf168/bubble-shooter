<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bubble Shooter</title>
<style>
  :root {
    --bg: #1b1f3a;
    --panel: #262b52;
    --text: #f4f5ff;
    --muted: #a9aed8;
    --accent: #ffcc00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #2a3070 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; align-items: center; height: 100%; padding: 8px; gap: 8px; }
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border-radius: 12px; padding: 6px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
  .stat .label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; }
  .icon {
    width: 36px; height: 36px; border-radius: 10px; border: 0; cursor: pointer;
    background: #353b6e; color: var(--text); font-size: 18px; line-height: 1;
  }
  .icon:hover { background: #434a86; }
  #stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: flex-start; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); cursor: crosshair; }
  #overlay {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(20, 22, 52, .72); backdrop-filter: blur(3px); text-align: center; padding: 24px;
  }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-size: 34px; font-weight: 900; letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #overlay p { color: #d7daf7; font-size: 15px; line-height: 1.5; max-width: 320px; }
  #overlay .big { font-size: 22px; font-weight: 800; color: var(--accent); }
  #overlay button {
    margin-top: 6px; padding: 12px 34px; border: 0; border-radius: 999px; cursor: pointer;
    font-size: 18px; font-weight: 800; color: #1b1f3a;
    background: linear-gradient(#ffe066, #ffb800); box-shadow: 0 4px 0 #b37f00, 0 8px 18px rgba(0,0,0,.35);
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b37f00; }
  .keys { font-size: 12px !important; color: var(--muted) !important; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><span class="label">Level</span><span class="value" id="level">1</span></div>
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
    <div class="actions">
      <button class="icon" id="mute" aria-label="Toggle sound" title="Sound">🔊</button>
      <button class="icon" id="restart" aria-label="Restart" title="Restart">↻</button>
    </div>
  </header>
  <main id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay" hidden></div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  // ---------- Constants ----------
  const COLS = 12;              // bubbles in a full row
  const R = 20;                 // bubble radius (logical px)
  const D = R * 2;
  const ROW_H = R * Math.sqrt(3);
  const W = COLS * D;           // 480
  const H = 700;
  const SHOOTER_X = W / 2;
  const SHOOTER_Y = H - 52;
  const DEADLINE = SHOOTER_Y - D - 8;
  const SPEED = 1150;           // px / second
  const HIT = D - 6;            // collision distance (a little forgiving so shots slip through gaps)
  const MIN_ANGLE = 0.13;       // radians from horizontal
  const NEXT_POS = { x: SHOOTER_X - 62, y: SHOOTER_Y + 14 };
  const POP_TIME = 0.22;

  const COLORS = [
    { base: '#e5232b', light: '#ff9a9a', dark: '#6e0a10' }, // red
    { base: '#ffc800', light: '#fff7b0', dark: '#9a6200' }, // yellow
    { base: '#2fbf3a', light: '#b0f7a8', dark: '#0b5414' }, // green
    { base: '#2348e0', light: '#9cb8ff', dark: '#081868' }, // blue
    { base: '#17c3e3', light: '#c2f8ff', dark: '#045f72' }, // cyan
    { base: '#df37cc', light: '#ffb3f5', dark: '#650858' }, // magenta
  ];

  // ---------- DOM ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const elLevel = document.getElementById('level');
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');
  const elMute = document.getElementById('mute');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- State ----------
  let grid = [];        // grid[row][col] = color index | null
  let parity = 0;       // flips each time a row is pushed in, so existing rows keep their offset
  let level = 1, score = 0, best = store.get('bubbleShooter.best', 0);
  let misses = 0, cfg = null;
  let current = 0, next = 0, proj = null;
  let aimAngle = Math.PI / 2, aimValid = false, aiming = false, hovering = false;
  let pops = [], falls = [], particles = [], texts = [];
  let state = 'menu', shiftAnim = 0, time = 0;
  let muted = store.get('bubbleShooter.muted', false);
  let sprites = [];

  // ---------- Grid helpers ----------
  const isOffset = r => ((r + parity) & 1) === 1;
  const rowLen = r => isOffset(r) ? COLS - 1 : COLS;
  const cellX = (r, c) => c * D + R + (isOffset(r) ? R : 0);
  const cellY = r => R + r * ROW_H;
  const getCell = (r, c) => (grid[r] && grid[r][c] !== undefined) ? grid[r][c] : null;
  const rand = n => Math.floor(Math.random() * n);

  function ensureRows(r) {
    while (grid.length <= r) grid.push(new Array(rowLen(grid.length)).fill(null));
  }

  function neighborsRaw(r, c) {
    const out = [[r, c - 1], [r, c + 1]];
    const dc = isOffset(r) ? [0, 1] : [-1, 0];
    for (const dr of [-1, 1]) for (const d of dc) out.push([r + dr, c + d]);
    return out.filter(([a, b]) => a >= 0 && b >= 0 && b < rowLen(a));
  }
  const neighbors = (r, c) => neighborsRaw(r, c).filter(([a]) => a < grid.length);

  function colorsOnBoard() {
    const s = new Set();
    for (const row of grid) for (const v of row) if (v != null) s.add(v);
    return [...s];
  }
  function bubbleCount() {
    let n = 0;
    for (const row of grid) for (const v of row) if (v != null) n++;
    return n;
  }
  function makeShot() {
    const cs = colorsOnBoard();
    const pool = cs.length ? cs : [...Array(cfg.colors).keys()];
    return pool[rand(pool.length)];
  }
  function refreshShots() {
    const cs = new Set(colorsOnBoard());
    if (!cs.size) return;
    if (!cs.has(current)) current = makeShot();
    if (!cs.has(next)) next = makeShot();
  }

  function levelConfig(n) {
    return {
      rows: Math.min(4 + n, 10),
      colors: Math.min(3 + n, 6),
      missesPerRow: Math.max(3, 6 - Math.floor((n - 1) / 2)),
    };
  }

  function buildLevel() {
    cfg = levelConfig(level);
    grid = []; parity = 0; misses = 0;
    pops = []; falls = []; particles = []; texts = []; proj = null; shiftAnim = 0;
    for (let r = 0; r < cfg.rows; r++) {
      ensureRows(r);
      for (let c = 0; c < rowLen(r); c++) {
        let col = rand(cfg.colors);
        if (Math.random() < 0.5) { // copy a neighbour's colour so clusters form
          const opts = [];
          for (const [a, b] of neighbors(r, c)) {
            if ((a < r || (a === r && b < c)) && grid[a][b] != null) opts.push(grid[a][b]);
          }
          if (opts.length) col = opts[rand(opts.length)];
        }
        grid[r][c] = col;
      }
    }
    current = makeShot();
    next = makeShot();
    updateHud();
  }

  function floodSame(r, c) {
    const color = grid[r][c];
    const seen = new Set([r + ',' + c]);
    const stack = [[r, c]], out = [];
    while (stack.length) {
      const [a, b] = stack.pop();
      out.push([a, b]);
      for (const [x, y] of neighbors(a, b)) {
        const k = x + ',' + y;
        if (!seen.has(k) && grid[x][y] === color) { seen.add(k); stack.push([x, y]); }
      }
    }
    return out;
  }

  function findFloating() {
    const seen = new Set(), stack = [];
    if (grid.length) {
      for (let c = 0; c < rowLen(0); c++) if (grid[0][c] != null) { seen.add('0,' + c); stack.push([0, c]); }
    }
    while (stack.length) {
      const [a, b] = stack.pop();
      for (const [x, y] of neighbors(a, b)) {
        const k = x + ',' + y;
        if (!seen.has(k) && grid[x][y] != null) { seen.add(k); stack.push([x, y]); }
      }
    }
    const out = [];
    for (let r = 0; r < grid.length; r++)
      for (let c = 0; c < grid[r].length; c++)
        if (grid[r][c] != null && !seen.has(r + ',' + c)) out.push([r, c]);
    return out;
  }

  function trimRows() {
    while (grid.length && grid[grid.length - 1].every(v => v == null)) grid.pop();
  }

  function lowestBubbleY() {
    for (let r = grid.length - 1; r >= 0; r--) if (grid[r].some(v => v != null)) return cellY(r);
    return -Infinity;
  }

  // ---------- Physics ----------
  function hitsBubble(x, y) {
    for (let r = 0; r < grid.length; r++) {
      const cy = cellY(r);
      if (Math.abs(cy - y) > D) continue;
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] == null) continue;
        const dx = cellX(r, c) - x, dy = cy - y;
        if (dx * dx + dy * dy < HIT * HIT) return true;
      }
    }
    return false;
  }

  // Walks a shot along its path (with wall bounces) until it touches the ceiling or a bubble.
  function trace(angle, maxLen, onStep) {
    let x = SHOOTER_X, y = SHOOTER_Y, dx = Math.cos(angle), dy = -Math.sin(angle);
    const step = 3;
    for (let t = 0; t < maxLen; t += step) {
      x += dx * step; y += dy * step;
      if (x < R) { x = 2 * R - x; dx = -dx; }
      else if (x > W - R) { x = 2 * (W - R) - x; dx = -dx; }
      if (onStep) onStep(x, y, t);
      if (y <= R || hitsBubble(x, y)) return { x, y, hit: true };
    }
    return { x, y, hit: false };
  }

  function snapCell(x, y) {
    const rg = Math.max(0, Math.round((y - R) / ROW_H));
    let best = null, bd = Infinity, bestAny = null, bda = Infinity;
    for (let r = Math.max(0, rg - 1); r <= rg + 1; r++) {
      for (let c = 0; c < rowLen(r); c++) {
        if (getCell(r, c) != null) continue;
        const d = (cellX(r, c) - x) ** 2 + (cellY(r) - y) ** 2;
        if (d < bda) { bda = d; bestAny = { r, c }; }
        const supported = r === 0 || neighborsRaw(r, c).some(([a, b]) => getCell(a, b) != null);
        if (supported && d < bd) { bd = d; best = { r, c }; }
      }
    }
    return best || bestAny;
  }

  function fire() {
    if (state !== 'play' || proj || shiftAnim > 0 || !aimValid) return;
    proj = { x: SHOOTER_X, y: SHOOTER_Y, dx: Math.cos(aimAngle), dy: -Math.sin(aimAngle), color: current };
    current = next;
    next = makeShot();
    sfx('shoot');
  }

  function swap() {
    if (state !== 'play' || proj) return;
    [current, next] = [next, current];
    sfx('swap');
  }

  function land(x, y, color) {
    const cell = snapCell(x, y);
    if (!cell) return;
    ensureRows(cell.r);
    grid[cell.r][cell.c] = color;
    const lx = cellX(cell.r, cell.c), ly = cellY(cell.r);

    const group = floodSame(cell.r, cell.c);
    if (group.length >= 3) {
      group.forEach(([r, c], i) => {
        const px = cellX(r, c), py = cellY(r);
        pops.push({ x: px, y: py, color: grid[r][c], t: -i * 0.03 });
        burst(px, py, grid[r][c]);
        grid[r][c] = null;
      });
      const floating = findFloating();
      floating.forEach(([r, c]) => {
        falls.push({ x: cellX(r, c), y: cellY(r), vx: (Math.random() - 0.5) * 180, vy: -80 - Math.random() * 220, color: grid[r][c] });
        grid[r][c] = null;
      });
      let pts = group.length * 10 + floating.length * 20;
      if (floating.length >= 5) pts *= 2;
      addScore(pts, lx, ly);
      sfx('pop', group.length);
      if (floating.length) setTimeout(() => sfx('drop'), 120);
    } else {
      misses++;
      sfx('stick');
    }

    trimRows();
    if (bubbleCount() === 0) { levelClear(); return; }
    if (misses >= cfg.missesPerRow) { addRow(); misses = 0; }
    refreshShots();
    if (lowestBubbleY() + R > DEADLINE) gameOver();
  }

  function addRow() {
    parity ^= 1; // keep existing rows' offsets after they shift down one row
    const n = isOffset(0) ? COLS - 1 : COLS;
    const cs = colorsOnBoard();
    const pool = cs.length ? cs : [...Array(cfg.colors).keys()];
    const row = [];
    for (let c = 0; c < n; c++) row.push(pool[rand(pool.length)]);
    grid.unshift(row);
    shiftAnim = ROW_H;
    sfx('row');
  }

  function addScore(pts, x, y) {
    score += pts;
    texts.push({ x, y, txt: '+' + pts, t: 0 });
    if (score > best) { best = score; store.set('bubbleShooter.best', best); }
    updateHud();
  }

  function burst(x, y, color) {
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.2, t: 0, color });
    }
  }

  // ---------- Game flow ----------
  function updateHud() {
    elLevel.textContent = level;
    elScore.textContent = score;
    elBest.textContent = best;
    elMute.textContent = muted ? '🔇' : '🔊';
  }

  function showOverlay(html, btnText, onClick) {
    overlay.innerHTML = html + `<button type="button">${btnText}</button>`;
    overlay.hidden = false;
    overlay.querySelector('button').onclick = () => { audio(); overlay.hidden = true; onClick(); };
  }

  function startGame() {
    level = 1; score = 0;
    buildLevel();
    state = 'play';
    overlay.hidden = true;
  }

  function levelClear() {
    const bonus = 250 * level;
    score += bonus;
    if (score > best) { best = score; store.set('bubbleShooter.best', best); }
    updateHud();
    state = 'clear';
    sfx('win');
    setTimeout(() => showOverlay(
      `<h1>Level ${level} cleared!</h1><p class="big">+${bonus} bonus</p><p>Score: ${score}</p>`,
      'Next level',
      () => { level++; buildLevel(); state = 'play'; }
    ), 600);
  }

  function gameOver() {
    state = 'over';
    sfx('lose');
    setTimeout(() => showOverlay(
      `<h1>Game over</h1><p class="big">${score} points</p><p>Best: ${best} · Reached level ${level}</p>`,
      'Play again',
      startGame
    ), 500);
  }

  function showMenu() {
    state = 'menu';
    showOverlay(
      `<h1>Bubble Shooter</h1>
       <p>Aim with your mouse or finger and release to shoot. Match <b>3 or more</b> of the same colour to pop them. Bubbles cut loose from the top fall for bonus points.</p>
       <p>Every few shots that don't pop anything, a new row pushes down. Don't let the bubbles cross the line!</p>
       <p class="keys">Tap the small bubble to swap · Keys: ← → aim, Space shoot, S swap</p>`,
      'Play',
      startGame
    );
  }

  // ---------- Audio ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, slide = 1, delay = 0) {
    const a = actx;
    if (!a || muted) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfx(kind, n = 0) {
    switch (kind) {
      case 'shoot': tone(560, 0.09, 'triangle', 0.07, 0.55); break;
      case 'swap':  tone(440, 0.06, 'sine', 0.06, 1.4); break;
      case 'stick': tone(200, 0.08, 'sine', 0.12, 0.6); break;
      case 'pop':
        for (let i = 0; i < Math.min(n, 6); i++) tone(620 + i * 90, 0.12, 'sine', 0.09, 1.7, i * 0.035);
        break;
      case 'drop':  tone(500, 0.35, 'triangle', 0.08, 0.35); break;
      case 'row':   tone(130, 0.22, 'sawtooth', 0.04, 0.8); break;
      case 'win':   [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, 1, i * 0.11)); break;
      case 'lose':  [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 1, i * 0.14)); break;
    }
  }

  // ---------- Rendering ----------
  function buildSprites() {
    const k = canvas.width / W; // device px per logical px
    const size = Math.ceil((D + 2) * k);
    sprites = COLORS.map(col => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const g = cv.getContext('2d');
      g.scale(size / (D + 2), size / (D + 2));
      const cx = R + 1, cy = R + 1;
      const grd = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.08, cx, cy, R);
      grd.addColorStop(0, col.light);
      grd.addColorStop(0.5, col.base);
      grd.addColorStop(1, col.dark);
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, R - 0.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1; g.stroke();
      // specular highlight
      g.fillStyle = 'rgba(255,255,255,.8)';
      g.beginPath(); g.ellipse(cx - R * 0.33, cy - R * 0.45, R * 0.34, R * 0.18, -0.55, 0, Math.PI * 2); g.fill();
      // soft rim light bottom-right
      g.fillStyle = 'rgba(255,255,255,.18)';
      g.beginPath(); g.arc(cx + R * 0.38, cy + R * 0.42, R * 0.22, 0, Math.PI * 2); g.fill();
      return cv;
    });
  }

  function drawBubble(color, x, y, s = 1, alpha = 1) {
    const sp = sprites[color];
    if (!sp) return;
    const size = (D + 2) * s;
    if (alpha !== 1) ctx.globalAlpha = alpha;
    ctx.drawImage(sp, x - size / 2, y - size / 2, size, size);
    if (alpha !== 1) ctx.globalAlpha = 1;
  }

  let bgGrad = null;
  function draw() {
    const k = canvas.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (!bgGrad) {
      bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#dcdcff');
      bgGrad.addColorStop(1, '#b4b7f2');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // launcher zone + danger line
    ctx.fillStyle = 'rgba(40, 44, 120, 0.10)';
    ctx.fillRect(0, DEADLINE, W, H - DEADLINE);
    const danger = lowestBubbleY() + R > DEADLINE - ROW_H * 2;
    ctx.strokeStyle = danger ? `rgba(230,30,50,${0.55 + 0.35 * Math.sin(time * 8)})` : 'rgba(40,44,120,.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(0, DEADLINE); ctx.lineTo(W, DEADLINE); ctx.stroke();
    ctx.setLineDash([]);

    // grid
    const oy = -shiftAnim;
    for (let r = 0; r < grid.length; r++) {
      const y = cellY(r) + oy;
      for (let c = 0; c < grid[r].length; c++) {
        const v = grid[r][c];
        if (v != null) drawBubble(v, cellX(r, c), y);
      }
    }

    // popping bubbles
    for (const p of pops) {
      if (p.t < 0) drawBubble(p.color, p.x, p.y);
      else { const q = p.t / POP_TIME; drawBubble(p.color, p.x, p.y, 1 + 0.45 * q, 1 - q); }
    }

    // particles
    for (const p of particles) {
      const q = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, q);
      ctx.fillStyle = COLORS[p.color].light;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2 + 2.5 * q, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // aim guide
    if (state === 'play' && aimValid && (hovering || aiming) && !proj && shiftAnim === 0) {
      const dotColor = COLORS[current].base;
      ctx.fillStyle = dotColor;
      let i = 0;
      const end = trace(aimAngle, 1400, (x, y, t) => {
        if (t > R + 6 && t % 20 < 3) {
          const a = Math.max(0.25, 1 - t / 1400);
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(x, y, 3.6, 0, Math.PI * 2); ctx.fill();
          i++;
        }
      });
      ctx.globalAlpha = 1;
      if (end.hit) {
        const cell = snapCell(end.x, end.y);
        if (cell) {
          ctx.strokeStyle = 'rgba(255,255,255,.85)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(cellX(cell.r, cell.c), cellY(cell.r), R - 2, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    // projectile
    if (proj) drawBubble(proj.color, proj.x, proj.y);

    // shooter
    ctx.fillStyle = 'rgba(30, 34, 90, .18)';
    ctx.beginPath(); ctx.arc(SHOOTER_X, SHOOTER_Y, R + 9, 0, Math.PI * 2); ctx.fill();
    if (state === 'play' || state === 'menu') {
      // pointer arrow
      const ax = SHOOTER_X + Math.cos(aimAngle) * (R + 16), ay = SHOOTER_Y - Math.sin(aimAngle) * (R + 16);
      ctx.save();
      ctx.translate(ax, ay); ctx.rotate(-aimAngle);
      ctx.fillStyle = 'rgba(30,34,90,.55)';
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-4, -7); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    drawBubble(current, SHOOTER_X, SHOOTER_Y);

    // next bubble (tap to swap)
    ctx.fillStyle = 'rgba(30, 34, 90, .14)';
    ctx.beginPath(); ctx.arc(NEXT_POS.x, NEXT_POS.y, R * 0.75 + 5, 0, Math.PI * 2); ctx.fill();
    drawBubble(next, NEXT_POS.x, NEXT_POS.y, 0.75);
    ctx.fillStyle = 'rgba(30,34,90,.65)';
    ctx.font = '700 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SWAP ⇄', NEXT_POS.x, NEXT_POS.y + R + 8);

    // shots left before a new row
    if (cfg) {
      const left = cfg.missesPerRow - misses;
      const bx = SHOOTER_X + 50, by = SHOOTER_Y + 14;
      ctx.textAlign = 'left';
      ctx.fillText('NEW ROW', bx, by - 10);
      for (let i = 0; i < cfg.missesPerRow; i++) {
        ctx.beginPath(); ctx.arc(bx + 4 + i * 11, by + 2, 4, 0, Math.PI * 2);
        if (i < left) { ctx.fillStyle = left <= 1 ? '#e5232b' : 'rgba(30,34,90,.7)'; ctx.fill(); }
        else { ctx.strokeStyle = 'rgba(30,34,90,.4)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      }
    }

    // falling bubbles
    for (const f of falls) drawBubble(f.color, f.x, f.y);

    // score popups
    ctx.textAlign = 'center';
    ctx.font = '900 20px system-ui, sans-serif';
    for (const t of texts) {
      const q = t.t / 0.9;
      ctx.globalAlpha = 1 - q;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,22,60,.6)';
      ctx.strokeText(t.txt, t.x, t.y - 40 * q);
      ctx.fillStyle = '#fff';
      ctx.fillText(t.txt, t.x, t.y - 40 * q);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Update loop ----------
  function update(dt) {
    time += dt;
    if (shiftAnim > 0) shiftAnim = Math.max(0, shiftAnim - dt * ROW_H * 5);

    if (proj) {
      let remain = SPEED * dt;
      while (remain > 0 && proj) {
        const s = Math.min(3, remain);
        remain -= s;
        proj.x += proj.dx * s; proj.y += proj.dy * s;
        if (proj.x < R) { proj.x = 2 * R - proj.x; proj.dx = -proj.dx; }
        else if (proj.x > W - R) { proj.x = 2 * (W - R) - proj.x; proj.dx = -proj.dx; }
        if (proj.y <= R || hitsBubble(proj.x, proj.y)) {
          const p = proj; proj = null;
          land(p.x, p.y, p.color);
        }
      }
    }

    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < POP_TIME);

    for (const f of falls) { f.vy += 2200 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    falls = falls.filter(f => f.y < H + D);

    for (const p of particles) { p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.t < p.life);

    for (const t of texts) t.t += dt;
    texts = texts.filter(t => t.t < 0.9);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Layout ----------
  function resize() {
    const stage = document.getElementById('stage');
    const hud = document.getElementById('hud');
    const aw = stage.clientWidth, ah = stage.clientHeight;
    const scale = Math.min(aw / W, ah / H);
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    hud.style.width = cw + 'px';
    bgGrad = null;
    buildSprites();
  }

  // ---------- Input ----------
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function updateAim(p) {
    const dy = SHOOTER_Y - p.y, dx = p.x - SHOOTER_X;
    if (dy < R * 0.5) { aimValid = false; return; }
    aimAngle = Math.min(Math.PI - MIN_ANGLE, Math.max(MIN_ANGLE, Math.atan2(dy, dx)));
    aimValid = true;
  }

  canvas.addEventListener('pointerdown', e => {
    audio();
    if (state !== 'play') return;
    const p = toLogical(e);
    if (Math.hypot(p.x - NEXT_POS.x, p.y - NEXT_POS.y) < R * 1.3) { swap(); return; }
    aiming = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    updateAim(p);
  });
  canvas.addEventListener('pointermove', e => {
    const p = toLogical(e);
    if (e.pointerType === 'mouse') hovering = true;
    if (aiming || e.pointerType === 'mouse') {
      // hovering over the swap bubble shouldn't kill the aim line
      if (Math.hypot(p.x - NEXT_POS.x, p.y - NEXT_POS.y) < R * 1.3 && !aiming) return;
      updateAim(p);
    }
  });
  canvas.addEventListener('pointerup', () => {
    if (!aiming) return;
    aiming = false;
    fire();
  });
  canvas.addEventListener('pointercancel', () => { aiming = false; });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hovering = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft') { aimAngle = Math.min(Math.PI - MIN_ANGLE, aimAngle + 0.04); aimValid = true; hovering = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight') { aimAngle = Math.max(MIN_ANGLE, aimAngle - 0.04); aimValid = true; hovering = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { audio(); aimValid = true; fire(); e.preventDefault(); }
    else if (e.key === 's' || e.key === 'S') { swap(); }
  });

  elMute.addEventListener('click', () => {
    muted = !muted;
    store.set('bubbleShooter.muted', muted);
    updateHud();
    audio();
  });
  document.getElementById('restart').addEventListener('click', () => { audio(); startGame(); });

  window.addEventListener('resize', resize);

  // ---------- Boot ----------
  resize();
  level = 1;
  buildLevel();
  showMenu();
  requestAnimationFrame(frame);

  // expose a tiny hook for debugging in the console
  window.bubbleShooter = { get state() { return state; }, get grid() { return grid; }, get score() { return score; } };
})();
</script>
</body>
</html>
